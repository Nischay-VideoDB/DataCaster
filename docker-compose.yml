name: datacaster

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: datacaster-backend
    image: datacaster-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Bind-mount SQLite so events survive `make rebuild` / `--force-recreate`.
    volumes:
      - ./datacaster.db:/app/datacaster.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datacaster-frontend
    image: datacaster-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
